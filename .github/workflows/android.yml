name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and lint
        run: gradle --no-daemon :device-core:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/fuzz-control-0.3.0-debug.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fuzz-control-apk
          path: dist/
          retention-days: 30
          if-no-files-found: error
